<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro</h1>

        <form id="formCadastro">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Mínimo 3 caracteres">
            <p id="erroNome"></p>

            <label for="email">E-mail</label>
            <input type="text" id="email" placeholder="usuario@email.com">
            <p id="erroEmail"></p>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">
            <p id="erroCpf"></p>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(99) 99999-9999">
            <p id="erroTelefone"></p>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Ex: Senha123">
            <p id="erroSenha"></p>

            <button type="submit">Cadastrar</button>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
